apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: african-myths-dev

replicas:
- name: african-myths-app
  count: 1
- name: african-myths-postgres
  count: 1

images:
- name: ghcr.io/emmanuel-soempit/african-myths
  newTag: development

resources:
- ../../base
- secrets/configmap.yaml
- ingress.yaml
- redirect-https.yaml

patches:
- target:
    kind: Deployment
    name: african-myths-postgres
  patch: |-
    - op: replace
      path: /spec/template/spec/volumes/0/hostPath/path
      value: /var/lib/african-myths/dev/postgres
