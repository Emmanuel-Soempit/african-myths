apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: african-myths-ingress
  namespace: african-myths-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - dev.myths.soempit.com
    secretName: african-myths-dev-tls
  rules:
  - host: dev.myths.soempit.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: african-myths-app
            port:
              number: 3333
