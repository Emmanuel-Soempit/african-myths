# Copy to secrets.yaml (gitignored), fill in real values, then on the cluster:
#   kubectl apply -f k8s/overlays/production/secrets/secrets.yaml
# Use DIFFERENT values from dev. Never commit real production credentials.
# Generate app_key with: node ace generate:key --show
# Generate db_password with: openssl rand -hex 24
apiVersion: v1
kind: Secret
metadata:
  name: african-myths-secrets
  namespace: african-myths-prod
type: Opaque
stringData:
  app_key: "replace_me"
  db_password: "replace_me"
  google_client_id: "replace_me"
  google_client_secret: "replace_me"
  deepseek_api_key: "replace_me"
  typesafe_api_key: "replace_me"
