apiVersion: v1
kind: ConfigMap
metadata:
  name: african-myths-config
  namespace: african-myths-prod
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "3333"
  TZ: "UTC"
  LOG_LEVEL: "info"
  SESSION_DRIVER: "cookie"
  APP_NAME: "African Myths"
  APP_URL: "https://myths.soempit.com"
  DB_HOST: "african-myths-postgres"
  DB_PORT: "5432"
  DB_USER: "african_myths"
  DB_DATABASE: "african_myths_db"
  STORAGE_DRIVER: "cloudinary"
  CLOUDINARY_CLOUD_NAME: "replace_me"
