name: Build & Deploy

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/emmanuel-soempit
  IMAGE_NAME: african-myths

jobs:
  # ─────────────────────────────────────────────
  # 1. Resolve target environment from branch
  # ─────────────────────────────────────────────
  set-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      overlay: ${{ steps.resolve.outputs.overlay }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      app_url: ${{ steps.resolve.outputs.app_url }}

    steps:
    - id: resolve
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          env_name="${{ inputs.target_environment }}"
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          env_name=production
        else
          env_name=dev
        fi

        echo "environment=$env_name" >> $GITHUB_OUTPUT
        echo "overlay=k8s/overlays/$env_name" >> $GITHUB_OUTPUT
        if [[ "$env_name" == "production" ]]; then
          echo "namespace=african-myths-prod" >> $GITHUB_OUTPUT
          echo "app_url=https://myths.soempit.com" >> $GITHUB_OUTPUT
        else
          echo "namespace=african-myths-dev" >> $GITHUB_OUTPUT
          echo "app_url=https://dev.myths.soempit.com" >> $GITHUB_OUTPUT
        fi

  # ─────────────────────────────────────────────
  # 2. Build & push Docker image
  # ─────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: set-env
    environment: ${{ needs.set-env.outputs.environment }}
    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set short SHA
      id: meta
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & push app
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          ${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  # ─────────────────────────────────────────────
  # 3. Deploy to Kubernetes via SSH on the VPS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ needs.set-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [set-env, build]
    environment:
      name: ${{ needs.set-env.outputs.environment }}
      url: ${{ needs.set-env.outputs.app_url }}

    steps:
    - name: Deploy over SSH
      id: deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        capture_stdout: true
        envs: OVERLAY,NAMESPACE,TAG,FULL_SHA,IMAGE
        script: |
          set -e
          cd "$HOME/african-myths"
          git fetch --all --prune
          # reset (not pull): kustomize edit mutates kustomization.yaml each
          # deploy, leaving a dirty tree — a deploy clone must be disposable.
          git reset --hard "$FULL_SHA"

          cd "$OVERLAY"
          kustomize edit set image ghcr.io/emmanuel-soempit/african-myths=$IMAGE:$TAG

          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"
          if ! kubectl get secret african-myths-secrets -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "::error::Secret african-myths-secrets missing in $NAMESPACE — apply $OVERLAY/secrets/secrets.yaml first"
            exit 1
          fi
          kubectl apply -k .

          kubectl rollout status deployment/african-myths-postgres -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/african-myths-app      -n "$NAMESPACE" --timeout=300s

          kubectl get pods -n "$NAMESPACE"
      env:
        OVERLAY: ${{ needs.set-env.outputs.overlay }}
        NAMESPACE: ${{ needs.set-env.outputs.namespace }}
        TAG: ${{ needs.build.outputs.sha }}
        FULL_SHA: ${{ github.sha }}
        IMAGE: ${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}

    - name: Deployment summary
      run: |
        echo "### Deployed to ${{ needs.set-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: ${{ needs.set-env.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **SHA**: ${{ needs.build.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace**: ${{ needs.set-env.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.deploy.outputs.stdout }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
