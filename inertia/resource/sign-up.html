<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
<label class="flex flex-col">
<p class="pb-2 text-sm font-medium text-secondary dark:text-gray-300">First Name</p>
<input class="form-input h-11 w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-transparent p-3 text-sm font-normal leading-normal text-secondary placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-gray-600 dark:text-white dark:placeholder:text-gray-500" placeholder="Enter your first name" type="text"/>
</label>
<label class="flex flex-col">
<p class="pb-2 text-sm font-medium text-secondary dark:text-gray-300">Last Name</p>

</label>

<input class="form-input h-11 w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-transparent p-3 text-sm font-normal leading-normal text-secondary placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-gray-600 dark:text-white dark:placeholder:text-gray-500" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-secondary dark:hover:text-white" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility_off">visibility_off</span>

</div>
</label>
